[package]
name = "java-interop"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
jni = "0.21.1"
ryu = "1.0.18"
uniffi = { version = "0.29", features = ["cli"] }

[build-dependencies]
cbindgen = "0.27.0"
uniffi = { version = "0.29", features = ["build"] }
